<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory & Store Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Authentication View -->
    <main
      id="auth-view"
      class="view"
      style="max-width: 480px; margin: 60px auto"
    >
      <section class="card">
        <h2 style="text-align: center; margin-bottom: 1.5rem">System Portal</h2>

        <!-- Auth Tabs -->
        <div
          style="
            display: flex;
            gap: 5px;
            margin-bottom: 1.5rem;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 8px;
          "
        >
          <button
            id="tab-cust-login-btn"
            onclick="switchAuthTab('cust-login')"
            class="btn-primary"
            style="flex: 1; font-size: 0.85rem"
          >
            Customer Login
          </button>
          <button
            id="tab-cust-reg-btn"
            onclick="switchAuthTab('cust-reg')"
            class="btn-secondary"
            style="flex: 1; font-size: 0.85rem"
          >
            Register
          </button>
          <button
            id="tab-admin-login-btn"
            onclick="switchAuthTab('admin-login')"
            class="btn-secondary"
            style="flex: 1; font-size: 0.85rem"
          >
            Admin Login
          </button>
        </div>

        <!-- Customer Login Form -->
        <form id="cust-login-form" onsubmit="handleAuth(event, 'login')">
          <h3 style="margin-bottom: 1rem">Customer Sign In</h3>
          <input
            type="text"
            name="username"
            placeholder="Username"
            class="form-input"
            style="margin-bottom: 0.75rem"
            required
          />
          <input
            type="password"
            name="password"
            placeholder="Password"
            class="form-input"
            style="margin-bottom: 1.25rem"
            required
          />
          <button type="submit" class="btn-primary" style="width: 100%">
            Login to Shop
          </button>
        </form>

        <!-- Customer Register Form -->
        <form
          id="cust-reg-form"
          onsubmit="handleAuth(event, 'register')"
          style="display: none"
        >
          <h3 style="margin-bottom: 1rem">Create New Customer Account</h3>
          <input
            type="text"
            name="username"
            placeholder="Choose Username"
            class="form-input"
            style="margin-bottom: 0.75rem"
            required
          />
          <input
            type="password"
            name="password"
            placeholder="Choose Password"
            class="form-input"
            style="margin-bottom: 1.25rem"
            required
          />
          <button type="submit" class="btn-success" style="width: 100%">
            Create Account & Shop
          </button>
        </form>

        <!-- Admin Login Form -->
        <form
          id="admin-login-form"
          onsubmit="handleAuth(event, 'login')"
          style="display: none"
        >
          <h3 style="margin-bottom: 1rem">Admin Portal</h3>
          <input
            type="text"
            name="username"
            placeholder="Admin Username"
            class="form-input"
            style="margin-bottom: 0.75rem"
            value="admin"
            required
          />
          <input
            type="password"
            name="password"
            placeholder="Admin Password"
            class="form-input"
            style="margin-bottom: 1.25rem"
            required
          />
          <button
            type="submit"
            class="btn-primary"
            style="width: 100%; background-color: #0f172a"
          >
            Login as Admin
          </button>
        </form>

        <div id="auth-error" style="margin-top: 1rem"></div>
      </section>
    </main>

    <!-- Store & Admin Dashboard -->
    <div
      id="dashboard-view"
      class="view"
      style="display: none; padding: 2rem; max-width: 1200px; margin: 0 auto"
    >
      <nav
        id="navbar"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 2rem;
          border-bottom: 1px solid #e2e8f0;
          padding-bottom: 1rem;
        "
      >
        <div>
          <h1 id="view-title" style="margin: 0; display: inline-block">
            Storefront
          </h1>
          <span
            id="user-badge"
            style="
              margin-left: 10px;
              background: #e0e7ff;
              color: #4338ca;
              padding: 4px 10px;
              border-radius: 999px;
              font-weight: 700;
              font-size: 0.85rem;
            "
          ></span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center">
          <button
            id="nav-suppliers-btn"
            onclick="showSupplierListView()"
            class="btn-secondary"
            style="display: none"
          >
            Suppliers List
          </button>
          <button onclick="logout()" class="btn-secondary">Logout</button>
        </div>
      </nav>

      <main
        id="main-layout"
        style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem"
      >
        <!-- Admin Management Controls (Admin-Only) -->
        <section id="admin-forms">
          <div class="card" style="margin-bottom: 1.5rem">
            <h2>Add Product</h2>
            <form onsubmit="saveProduct(event)">
              <input
                type="text"
                name="name"
                placeholder="Product Name"
                class="form-input"
                style="margin-bottom: 0.75rem"
                required
              />
              <input
                type="number"
                name="quantity"
                placeholder="Quantity"
                class="form-input"
                style="margin-bottom: 0.75rem"
                required
              />
              <input
                type="number"
                step="0.01"
                name="price"
                placeholder="Price ($)"
                class="form-input"
                style="margin-bottom: 0.75rem"
                required
              />
              <select
                id="supplier-select"
                name="SupplierId"
                class="form-input"
                style="margin-bottom: 0.75rem"
                required
              ></select>
              <input
                type="file"
                name="image"
                onchange="previewImage(event)"
                class="form-input"
                style="margin-bottom: 0.75rem"
                accept="image/*"
              />
              <img
                id="image-preview"
                src=""
                alt="Preview"
                style="
                  display: none;
                  width: 100%;
                  border-radius: 8px;
                  margin-bottom: 0.75rem;
                "
              />
              <button type="submit" class="btn-primary" style="width: 100%">
                Add Product
              </button>
            </form>
          </div>

          <div class="card" style="margin-bottom: 1.5rem">
            <h2>Add Supplier</h2>
            <form onsubmit="saveSupplier(event)">
              <input
                type="text"
                name="name"
                placeholder="Supplier Name"
                class="form-input"
                style="margin-bottom: 0.75rem"
                required
              />
              <input
                type="text"
                name="contact"
                placeholder="Contact Info / Email / Phone"
                class="form-input"
                style="margin-bottom: 0.75rem"
                required
              />
              <button type="submit" class="btn-secondary" style="width: 100%">
                Add Supplier
              </button>
            </form>
          </div>

          <div class="card">
            <h2>Manage Suppliers</h2>
            <div id="supplier-list" style="margin-top: 1rem"></div>
          </div>
        </section>

        <!-- Item Catalog -->
        <section id="product-list-container">
          <h2>Products Catalog</h2>

          <!-- Search & Filter Controls -->
          <div
            style="display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap"
          >
            <input
              type="text"
              id="product-search"
              placeholder="Search products by name..."
              class="form-input"
              style="flex: 2; min-width: 200px; margin-bottom: 0"
              oninput="filterProducts()"
            />
            <select
              id="supplier-filter"
              class="form-input"
              style="flex: 1; min-width: 150px; margin-bottom: 0"
              onchange="filterProducts()"
            >
              <option value="">All Suppliers</option>
            </select>
          </div>

          <div id="product-list" style="margin-top: 1rem"></div>
        </section>
      </main>
    </div>

    <!-- Product Detail View Page -->
    <div
      id="product-detail-view"
      class="view"
      style="display: none; padding: 2rem; max-width: 800px; margin: 0 auto"
    >
      <nav
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 2rem;
          border-bottom: 1px solid #e2e8f0;
          padding-bottom: 1rem;
          background: rgba(255, 255, 255, 0.75);
          backdrop-filter: blur(12px);
          border-radius: 1rem;
          padding: 1.5rem;
        "
      >
        <h1 style="margin: 0; font-size: 1.5rem">Product Details</h1>
        <button onclick="backToDashboard()" class="btn-secondary">
          Back to Catalog
        </button>
      </nav>

      <section
        class="card"
        style="
          display: flex;
          gap: 2rem;
          flex-wrap: wrap;
          align-items: flex-start;
        "
      >
        <div style="flex: 1; min-width: 250px">
          <img
            id="detail-product-image"
            src=""
            alt="Product Image"
            style="
              width: 100%;
              border-radius: 12px;
              object-fit: cover;
              max-height: 350px;
              display: none;
            "
          />
          <div
            id="detail-product-no-image"
            style="
              width: 100%;
              height: 250px;
              background: #e2e8f0;
              border-radius: 12px;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #64748b;
              font-weight: 600;
            "
          >
            No Image Available
          </div>
        </div>
        <div
          style="
            flex: 1.5;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
          "
        >
          <h2
            id="detail-product-name"
            style="margin: 0; font-size: 1.75rem"
          ></h2>
          <div>
            <span style="font-weight: 600; color: #64748b">Price:</span>
            <span
              id="detail-product-price"
              style="font-size: 1.25rem; font-weight: 700; color: #0f172a"
            ></span>
          </div>
          <div>
            <span style="font-weight: 600; color: #64748b"
              >Stock Quantity:</span
            >
            <span id="detail-product-quantity" style="font-weight: 600"></span>
          </div>
          <div>
            <span style="font-weight: 600; color: #64748b">Supplier:</span>
            <span id="detail-product-supplier" style="font-weight: 600"></span>
          </div>
          <div id="detail-product-action" style="margin-top: 1rem"></div>
        </div>
      </section>
    </div>

    <!-- Supplier List Page -->
    <div
      id="supplier-list-view"
      class="view"
      style="display: none; padding: 2rem; max-width: 900px; margin: 0 auto"
    >
      <nav
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 2rem;
          border-bottom: 1px solid #e2e8f0;
          padding-bottom: 1rem;
          background: rgba(255, 255, 255, 0.75);
          backdrop-filter: blur(12px);
          border-radius: 1rem;
          padding: 1.5rem;
        "
      >
        <h1 style="margin: 0; font-size: 1.5rem">Suppliers Directory</h1>
        <button onclick="backToDashboard()" class="btn-secondary">
          Back to Dashboard
        </button>
      </nav>

      <section class="card">
        <h2>All Registered Suppliers</h2>
        <div id="full-supplier-table-container" style="margin-top: 1rem"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
